spring.application.name=commerce
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.format_sql=true
jwt.expires-in=${JWT_EXIPIRES_IN:300000}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}
app.max-image-per-product=${MAX_IMAGE_PER_PRODUCT:10}

# IGDB API
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
igdb.api.base-url=${IGDB_API_BASE_URL:}
igdb.auth.url=${IGDB_AUTH_URL:}
igdb.search.limit=${IGDB_SEARCH_LIMIT:10}

# AWS S3
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static-region=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${AWS_BUCKET_NAME}