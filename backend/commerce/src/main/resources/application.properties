spring.application.name=commerce
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.format_sql=true
jwt.expires-in=${JWT_EXIPIRES_IN:300000}

# IGDB API
igdb.client-id=${IGDB_CLIENT_ID:}
igdb.client-secret=${IGDB_CLIENT_SECRET:}
igdb.api.base-url=${IGDB_API_BASE_URL:""}
igdb.auth.url=${IGDB_AUTH_URL:""}